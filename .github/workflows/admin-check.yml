name: Admin implementation checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/complete-admin-management]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check frontend
        run: npm run lint
      - name: Type-check server and setup scripts
        run: npm run check:server
      - name: Build frontend
        run: npm run build
      - name: Smoke-test Express server startup
        run: |
          npm start -- --port 3001 > /tmp/kisan-sahayak-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kisan-sahayak-server.log
          exit 1
