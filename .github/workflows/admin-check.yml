name: Admin implementation checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/complete-admin-management]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check frontend
        run: npm run lint
      - name: Type-check server and setup scripts
        run: npm run check:server
      - name: Build frontend
        run: npm run build
